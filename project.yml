name: YomiView
options:
  bundleIdPrefix: app.yomiview
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ja

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  YomiView:
    type: application
    platform: macOS
    sources:
      - path: YomiView
        excludes:
          - "Tests/**"
          - "Resources/AppIcon.icon/**"
          - "Resources/AppIcon.icon"
      # Icon Composer のアイコン（macOS 26 以降の形式。古い macOS 用のアイコンも actool が作る）
      - path: YomiView/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomiview.YomiView
        PRODUCT_NAME: YomiView
        INFOPLIST_FILE: YomiView/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  YomiViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YomiView/Tests
    dependencies:
      - target: YomiView
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomiview.YomiViewTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YomiView.app/Contents/MacOS/YomiView"

schemes:
  YomiView:
    build:
      targets:
        YomiView: all
        YomiViewTests: [test]
    test:
      targets:
        - YomiViewTests
